name: swarm-verify

# Re-verifies every pull request without trusting the machine it came from.
#
# The Swarm code and the project rules are taken from the BASE commit, never from the pull
# request, so a submission cannot bring its own verifier or its own rules. The job has a
# read-only token and, for pull requests from forks, no secrets.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: swarm-verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the base (trusted verifier and rules)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: base
          persist-credentials: false

      - name: Check out the pull request
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify pull request
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # The runner is a throwaway VM, which is the sandbox here.
        run: node base/bin/swarm.mjs ci --cwd pr --base "$BASE_SHA" --title "$PR_TITLE" --unsafe-no-sandbox

      - name: Verify main
        if: github.event_name == 'push'
        working-directory: base
        run: node bin/swarm.mjs verify --unsafe-no-sandbox
